name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The job only reads the repo and needs no secrets.
permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Matches the interpreter the project's venv was built with (3.11.5).
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      # Only the offline test suite runs here. It imports the real project, MCP
      # server, and eval modules but exercises pure logic (schemas, source
      # helpers, grading, the Critic evidence wiring, and the MCP interface
      # layer with run_pipeline stubbed), so it needs no OpenAI, Pinecone, or
      # Tavily key and makes no live model call.
      #
      # Scope, stated plainly: this verifies the MCP tool wiring, the answer
      # cache, and the rate limiter deterministically. It does NOT verify the
      # Critic's groundedness judgment. That judgment is a live gpt-4o-mini
      # call, so it needs real keys and stays in evals/eval.py, which is
      # intentionally not run here.
      - name: Run offline tests
        run: pytest tests/ -q
